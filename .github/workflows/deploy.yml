name: Deploy to GitHub Pages

# Publishes the same demo that `pnpm run dev` opens (index.html and demo/worldfile-fit.html).
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege by default; only the deploy job gets the Pages token scopes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      # pnpm 11 reads allowBuilds only from pnpm-workspace.yaml, which is kept out of the
      # repository root for local development (see the comment in ci/pnpm-workspace.ci.yaml).
      - name: Use CI pnpm settings
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The demo imports src directly, so no package build is needed first.
      - name: Build and verify demo site
        run: pnpm run verify:demo
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist-demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
