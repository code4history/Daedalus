name: CI

# Runs on every branch (no branches key).
on:
  push:
  pull_request:

permissions:
  contents: read

# Daedalus has no dependencies (no dependencies key at all), so CI checks out this
# repository alone. The demo (index.html and demo/) is built with vite; deploy.yml
# publishes it to GitHub Pages on pushes to master. This job checks the demo build and
# the shape of the Pages artifact (verify:demo).
#
# deploy.yml runs only on pushes to master. This job installs the same way (pnpm
# 11.27.0, the CI pnpm settings and --frozen-lockfile) and includes the Node.js version
# deploy.yml builds with, so an install problem shows up on the pull request instead of
# after the merge. tests/ci-workflow.test.ts keeps the two in step.
jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # pnpm 11 reads allowBuilds, minimumReleaseAgeExclude and overrides only from
      # pnpm-workspace.yaml, which is kept out of the repository root (see the comment in
      # ci/pnpm-workspace.ci.yaml).
      - name: Use CI pnpm settings
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm run test
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Check public type surface
        run: pnpm run test:types
      - name: Build package
        run: pnpm run build
      - name: Build and verify demo site
        run: pnpm run verify:demo
