name: CI

# ブランチ非限定（Atlas 前例と同一）∴ branches キーを持たない。
on:
  push:
  pull_request:

# Daedalus は依存を 1 件も持たない（dependencies キー自体が無い）∴ 単体 checkout で完結し、
# 兄弟リポジトリの checkout は不要である。デモ（index.html と demo/）は vite で作り、
# GitHub Pages への配備は deploy.yml が master への push で行う。ここではデモの build と
# Pages 用の成果物の形だけを検査する（verify:demo）。
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm run test
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Check public type surface
        run: pnpm run test:types
      - name: Build package
        run: pnpm run build
      - name: Build and verify demo site
        run: pnpm run verify:demo
