# CI-only pnpm settings. The workflows copy this file to pnpm-workspace.yaml right
# before `pnpm install --frozen-lockfile`.
#
# Why it is not committed as pnpm-workspace.yaml:
#   pnpm 11 reads allowBuilds only from pnpm-workspace.yaml (not from .npmrc or the
#   package.json "pnpm" field). A pnpm-workspace.yaml at the repository root would
#   also make this directory a workspace root during local development, where the
#   repository is used inside a larger workspace. CI clones the repository on its
#   own, so the copy is harmless there.
#
# Where the list comes from: running `pnpm install --frozen-lockfile` with pnpm
#   11.27.0, CI=true, lifecycle scripts enabled and no node_modules fails with
#   ERR_PNPM_IGNORED_BUILDS for the packages below (pnpm 11 sets strictDepBuilds
#   to true by default). Re-measure the same way when dependencies change.

allowBuilds:
  esbuild: true
